services:
  database:
    build:
      context: .
      dockerfile: ./DB/Dockerfile
    container_name: omnisite_prod_db
    restart: always
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: Admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin1234_production_key}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./DB/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U Admin -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: omnisite_prod_be
    restart: always
    environment:
      - DATABASE_URL=postgresql+psycopg://Admin:${POSTGRES_PASSWORD:-admin1234_production_key}@database:5432/postgres
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - PYTHONPATH=/workspace:/workspace/backend
    volumes:
      - ./Datasets:/workspace/Datasets:ro
      - ./seed_db.py:/workspace/seed_db.py:ro
      - ./backend/seed_db.py:/workspace/backend/seed_db.py:ro
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - BACKEND_API_URL=http://backend:8000
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-}
    container_name: omnisite_prod_fe
    restart: always
    ports:
      - "80:3000" # 80포트 대문 개방 (AWS Lightsail 기본 80포트 접속)
    environment:
      - BACKEND_API_URL=http://backend:8000
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-}
    depends_on:
      - backend

volumes:
  postgres_prod_data:

